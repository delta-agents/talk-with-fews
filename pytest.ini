[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    fews_services: Run test against all FEWS services
    fews_services_production: Run test against production services only
    fews_services_local: Run test against local services only
    fews_services_hdsr_wsvv: Run test against HDSR and WSVV services
    fews_services_water_boards: Run test against water board services
    actueelwaterbeeld: Tests for Actueel Waterbeeld service
    hdsr: Tests for HDSR service
    wsvv: Tests for WSVV service
    hhd: Tests for HHD service
    scheldestromen: Tests for Scheldestromen service
