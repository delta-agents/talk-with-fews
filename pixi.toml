[project]
name = "talk_with_fews"
version = "0.0.1"
description = "AI agents to talk with DelftFEWS"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]
readme = "README.md"
license = "GPL-3.0"
license-file = "LICENSE"

[tasks]
# Installation
install = "pre-commit install"
start = { cmd = "uvicorn main:app --host 0.0.0.0 --port 8000" }
start_webservice = { cmd = "uvicorn FewsWebService:app --host 0.0.0.0 --port 8000" }


# Docs
quartodoc-build = { cmd = "quartodoc build && rm objects.json", cwd = "docs" ,inputs = [
    "docs/_quarto.yml",
    "src/talk_with_fews",
    ],outputs = [
    "docs/reference/"
    ]}
quarto-preview = { cmd = "export QUARTO_PYTHON=python && quarto preview docs", depends-on = [
    "quartodoc-build",
] }
quarto-check = { cmd = "quarto check all", depends-on = ["quartodoc-build"] }
quarto-render = { cmd = "export QUARTO_PYTHON=python && quarto render docs --to html --execute", depends-on = [
    "quartodoc-build",
] }
docs = { depends-on = ["quarto-preview"] }
pre-commit = "pre-commit run --all-files"

test = "pytest"

[tool.ruff]
# Ruff configuration, see https://docs.astral.sh/ruff/configuration/
# lint.ignore = [
    # "E402",   # module not at top of py file
    #"E501",  # Line too long
    #"F401",  # Unused import
    #"F403",  # 'from module import *' used; unable to detect undefined names
    #"F405",  # Name may be undefined, or defined from star imports: module
    #"F841",  # Local variable name is assigned to but never used
    #"T201",  # Use of print statement (use print() function instead)
# ]

[dependencies]
python = ">=3.11"
ipykernel ="*"
ipywidgets ="*"
nbclient ="*"
nbformat ="*"
pre-commit = "*"
pytest-cov = "*"
quarto = ">=1.5.57"
quartodoc = ">=0.9.1"
ruff = ">=0.8.1"
tqdm = "*"
python-dotenv = ">=1.0.1"
openai = ">=1.12.0"
pydantic = ">=2.0.0"
pydantic-ai = "*"
pytest = ">=8.0.2"
pytest-asyncio = ">=0.25.0"
matplotlib = ">=3.10.3,<4"
fastapi = ">=0.115.14,<0.116"
fastmcp = ">=2.10.2,<3"
duckdb = ">=1.3.2,<2"

[pypi-dependencies]
talk_with_fews = { path = "src", editable = true }
