        - visualize_graph
        - execute_query
        - describe_timeseries
        - search_timeseries
        - get_transformation_details
        - search_transformations
        - find_workflow_call_hierarchy
        - search_workflows
        - get_workflow_details
    - title: Webservice tools
      desc: Tools beschikbaar voor de webservice agent.
      package: talk_with_fews.tools
      contents:
        - get_parameters
        - get_locations
        - execute_query_webservice
        - get_series_headers
        - get_series_statistics
    - title: Validator tools
      desc: Tools beschikbaar voor de validator agent.
      package: talk_with_fews.tools
