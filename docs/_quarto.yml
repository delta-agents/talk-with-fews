---
project:
  type: website

website:
  title: "Talk with FEWS"
  navbar:
    left:
      - text: "Documentatie"
        menu:
          - examples/notebooks/fews_config.ipynb
          - examples/notebooks/fews_webservice.ipynb
          - examples/notebooks/fews_validate_xml.ipynb
      - text: "Python API"
